name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Validate release version and extract changelog notes
        run: |
          python - <<'PY'
          from datetime import date
          import os
          from pathlib import Path
          import re
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Release tag must match the version in pyproject.toml")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          entry = re.search(
              rf"^## \[{re.escape(version)}\] - (\d{{4}}-\d{{2}}-\d{{2}})\n(.*?)(?=^## |\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if entry is None or not entry.group(2).strip():
              raise SystemExit("Changelog must contain a dated, non-empty entry for this version")
          date.fromisoformat(entry.group(1))
          Path("release-notes.md").write_text(entry.group(2).strip() + "\n", encoding="utf-8")
          PY

      - name: Install Poetry
        run: python -m pip install "poetry>=2.2,<3"

      - name: Validate metadata and lock file
        run: poetry check --lock

      - name: Install project and test dependencies
        run: |
          poetry env use "$(command -v python)"
          poetry install --no-interaction

      - name: Build distributions
        run: poetry build --no-interaction

      - name: Run unit and installed-command tests
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          WG_PEER_IP_WHEEL="${wheels[0]}" poetry run pytest

      - name: Upload tested distributions and release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package

      - name: Create release with tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
