name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.x"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: python -m pip install "poetry>=2.2,<3"

      - name: Validate metadata and lock file
        run: poetry check --lock

      - name: Install project and test dependencies
        run: |
          poetry env use "$(command -v python)"
          poetry install --no-interaction

      - name: Build distributions
        run: poetry build --no-interaction

      - name: Run unit and installed-command tests
        shell: bash
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          WG_PEER_IP_WHEEL="${wheels[0]}" poetry run pytest
